name: pharmaceylon

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pharmaceylon}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s

  migrate:
    image: pharmaceylon-api-migrate:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrator
    restart: "no"
    init: true
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-pharmaceylon}?schema=public"
    depends_on:
      db:
        condition: service_healthy

  api:
    image: pharmaceylon-api:local
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-pharmaceylon}?schema=public"
      WEB_ORIGINS: "${WEB_ORIGINS:-http://localhost:3000}"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env.docker}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env.docker}"
      JWT_ACCESS_TTL_SECONDS: "${JWT_ACCESS_TTL_SECONDS:-900}"
      JWT_REFRESH_TTL_SECONDS: "${JWT_REFRESH_TTL_SECONDS:-1209600}"
      USER_CONTEXT_TTL_SECONDS: "${USER_CONTEXT_TTL_SECONDS:-30}"
      COOKIE_SAMESITE: lax
      COOKIE_SECURE: "false"
      OPENAPI_ENABLED: "${OPENAPI_ENABLED:-true}"
      STRUCTURED_HTTP_LOG: "${STRUCTURED_HTTP_LOG:-true}"
      TENANT_TRANSACTION_CONTEXT_ENABLED: "false"
      RLS_CANARY_ENFORCED: "false"
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    volumes:
      - api_uploads:/app/apps/api/storage/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s

  web:
    image: pharmaceylon-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3000/api/v1}"
        API_PROXY_TARGET: "${API_PROXY_TARGET:-http://api:3001}"
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_PROXY_TARGET: "${API_PROXY_TARGET:-http://api:3001}"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 30s

volumes:
  postgres_data:
  api_uploads:
