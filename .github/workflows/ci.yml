name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pharmaceylon_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pharmaceylon_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Prisma 7 loads prisma.config.ts even for client generation. No DB
      # connection is opened by generate/type-check/build, but the variable
      # must be present for the config module to load.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pharmaceylon_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run prepare

      - name: Generate Prisma client
        run: npm run prisma:generate -w api

      - name: Apply Prisma migrations
        run: npm run prisma:deploy -w api

      - name: Lint (turbo)
        run: npm run lint

      - name: API unit tests
        run: npm test -w api
        env:
          JWT_ACCESS_SECRET: ci-access-secret
          JWT_REFRESH_SECRET: ci-refresh-secret

      - name: PostgreSQL RLS proof
        run: npm run test:rls-poc -w api

      - name: Validate staged RLS canary policies
        run: npm run test:rls-canary -w api

      - name: Validate complete tenant RLS policy inventory
        run: npm run test:rls-policy-inventory -w api

      - name: Exercise real RLS canary activation
        run: npm run test:rls-canary-activation -w api
        env:
          RLS_CANARY_TEST_ACK: ephemeral-database

      - name: Build API
        run: npm run build -w api

      - name: Build web
        run: npm run build -w web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api/v1

      - name: Validate Docker Compose
        run: docker compose --env-file .env.docker.example config --quiet

      - name: Build migration, API, and web container images
        run: docker compose --env-file .env.docker.example build migrate api web

      - name: Smoke-test migration container image
        run: |
          docker run --rm --network host \
            --env DATABASE_URL="$DATABASE_URL" \
            pharmaceylon-api-migrate:local

      - name: Smoke-test API container image
        run: |
          docker network create pharmaceylon-ci

          docker run --detach --name pharmaceylon-api-ci \
            --network pharmaceylon-ci \
            --network-alias api \
            --add-host host.docker.internal:host-gateway \
            --publish 127.0.0.1:3001:3001 \
            --env DATABASE_URL="${DATABASE_URL/127.0.0.1/host.docker.internal}" \
            --env JWT_ACCESS_SECRET=ci-access-secret \
            --env JWT_REFRESH_SECRET=ci-refresh-secret \
            pharmaceylon-api:local

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/api/v1/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          docker logs pharmaceylon-api-ci
          exit 1

      - name: Smoke-test web container and API proxy
        run: |
          docker run --detach --name pharmaceylon-web-ci \
            --network pharmaceylon-ci \
            --publish 127.0.0.1:3000:3000 \
            pharmaceylon-web:local

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              curl --fail --silent http://127.0.0.1:3000/api/v1/health > /dev/null
              exit 0
            fi
            sleep 2
          done

          docker logs pharmaceylon-web-ci
          exit 1

      - name: Clean up container smoke tests
        if: always()
        run: |
          docker rm --force pharmaceylon-web-ci 2>/dev/null || true
          docker rm --force pharmaceylon-api-ci 2>/dev/null || true
          docker network rm pharmaceylon-ci 2>/dev/null || true
