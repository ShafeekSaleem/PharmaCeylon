name: CI

on:
  push:
    branches: [develop, main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pharmaceylon_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pharmaceylon_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Prisma 7 loads prisma.config.ts even for client generation. No DB
      # connection is opened by generate/type-check/build, but the variable
      # must be present for the config module to load.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/pharmaceylon_ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run prepare

      - name: Generate Prisma client
        run: npm run prisma:generate -w api

      - name: Apply Prisma migrations
        run: npm run prisma:deploy -w api

      - name: Lint (turbo)
        run: npm run lint

      - name: API unit tests
        run: npm test -w api
        env:
          JWT_ACCESS_SECRET: ci-access-secret
          JWT_REFRESH_SECRET: ci-refresh-secret

      - name: PostgreSQL RLS proof
        run: npm run test:rls-poc -w api

      - name: Validate staged RLS canary policies
        run: npm run test:rls-canary -w api

      - name: Validate complete tenant RLS policy inventory
        run: npm run test:rls-policy-inventory -w api

      - name: Exercise real RLS canary activation
        run: npm run test:rls-canary-activation -w api
        env:
          RLS_CANARY_TEST_ACK: ephemeral-database

      - name: Build API
        run: npm run build -w api

      - name: Build web
        run: npm run build -w web
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3000/api/v1

  docker-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Separate volumes/network from both developer data and the RLS job DB.
      COMPOSE_PROJECT_NAME: pharmaceylon-ci-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_PORT: "5433"
      WEB_PORT: "3002"
      NEXT_PUBLIC_API_BASE_URL: /api/v1
      IMAGE_REVISION: ${{ github.sha }}
      WEB_ORIGINS: http://localhost:3002
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Test Docker verification scripts
        run: npm run test:docker-scripts

      - name: Prepare disposable CI configuration
        run: cp .env.docker.example .env.docker

      - name: Validate Docker Compose
        run: npm run docker:config

      - name: Build migration, API, and web container images
        run: npm run docker:build

      - name: Start actual Compose stack against an empty database
        run: npm run docker:start

      - name: Verify health, readiness, and web proxy
        run: npm run docker:check

      - name: Verify persistence, migration reruns, and failed-migration gate
        run: node scripts/docker/test-stack-lifecycle.mjs
        env:
          DOCKER_LIFECYCLE_TEST_ACK: ephemeral-compose-project

      - name: Test push, digest pull, and source-free bundle with a disposable registry
        run: node scripts/docker/test-local-registry.mjs

      - name: Install checksum-verified Trivy 0.74.0
        run: |
          curl --fail --location --retry 3 https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz -o "$RUNNER_TEMP/trivy.tar.gz"
          printf '%s  %s\n' '2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a' "$RUNNER_TEMP/trivy.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan all three images and enforce vulnerability policy
        run: node scripts/docker/scan-images.mjs

      - name: Retain vulnerability reports and SBOMs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-reports-${{ github.sha }}
          path: |
            release/scan-*.json
            release/sbom-*.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Export the exact tested and scanned images
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.repository == 'ShafeekSaleem/PharmaCeylon'
        run: node scripts/docker/release-images.mjs export

      - name: Hand off tested images to the restricted publisher
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.repository == 'ShafeekSaleem/PharmaCeylon'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-images-${{ github.sha }}
          path: |
            release/images.tar
            release/image-set.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Show Compose diagnostics
        if: always()
        run: |
          docker compose --env-file .env.docker.example ps --all
          docker compose --env-file .env.docker.example logs --no-color --tail 150

      - name: Remove only this disposable CI stack and its test volumes
        if: always()
        run: docker compose --env-file .env.docker.example down --volumes --remove-orphans

  publish-images:
    needs: [build-and-test, docker-stack]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.repository == 'ShafeekSaleem/PharmaCeylon'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ghcr-develop-publication
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Require this commit to come from a merged PR to develop
        run: node scripts/docker/check-publish-source.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tested-images-${{ github.sha }}
          path: release
      - name: Load and verify the tested image set (no rebuild)
        run: |
          docker image load -i release/images.tar
          node scripts/docker/release-images.mjs verify
      - name: Log in to GHCR with a repository-scoped temporary token
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish commit/run tags and record pulled digests
        run: node scripts/docker/release-images.mjs publish
      - name: Hand off candidate bundle for independent read-only verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-release-${{ github.sha }}
          path: release/bundle/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  verify-published-images:
    needs: publish-images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-release-${{ github.sha }}
          path: release/bundle
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull exact GHCR digests and run the source-free bundle
        run: node scripts/docker/test-image-bundle.mjs release/bundle
      - name: Remove ephemeral test settings from the distributable bundle
        run: rm -f release/bundle/.env.docker release/bundle/.env.images
      - name: Publish verified release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle
          path: release/bundle/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
      - name: Summarize the verified release
        run: |
          echo '### Verified Docker release' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the release-bundle artifact; it contains digest-pinned release.env and the operating guide.' >> "$GITHUB_STEP_SUMMARY"
          cat release/bundle/release.env >> "$GITHUB_STEP_SUMMARY"
